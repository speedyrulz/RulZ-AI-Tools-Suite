    date: "2026-11"
    people: null
    url: https://huggingface.co/black-forest-labs/FLUX.2-klein-base-4B
    note: "Apache 2.0, not gated; transformer 24 heads x 128, 5 double + 20 single blocks, joint_attention_dim 7680; Qwen3-4B text encoder (hidden 2560); Comfy-Org split_files layout."
