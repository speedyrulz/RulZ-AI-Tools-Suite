        sources: [atk_klein_lr_2026_07]
  - symptom: lost_motion
    causes:
      - "photos only: all blocks trained cut motion by about half on a video model"
    fixes:
      - set: {lora_blocks: {value: "20-49"}}
        why: "On the H3 video model the first 20 blocks carry motion; training only 20-49 on stills kept it. Only for video models."
        confidence: CONF
        sources: [bano_h3_blocks_2026_09]
      - action: "Mix in short clips (keep the video share meaningful) or add low-resolution video after the image phase."
