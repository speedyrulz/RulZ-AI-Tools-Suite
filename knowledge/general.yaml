  - symptom: needs_high_strength
    causes:
      - "undertrained"
      - "trained on a different checkpoint than it is used on (Raw vs Turbo)"
      - "the inference stack applies the LoRA weaker"
    fixes:
      - set: {learning_rate: {op: mul, value: 1.5}}
