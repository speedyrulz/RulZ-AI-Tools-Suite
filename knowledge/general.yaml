      - "audio shares layers with video; voice overtrains fast and starves with many images"
      - "ref2va adapters were not trained with reference audio"
      - "background music in the clips"
    fixes:
      - action: "RulZ AI Trainer trains the video only (audio never enters the loss): fix voice in a trainer that trains audio. In any trainer, keep the video loss at 0.7-1.0 while raising audio (video 1.0 / audio 0.7 worked), and strip background music from clips."
        why: "One user got good voice with video 0.2 but motion drifted."
        confidence: REP
        sources: [bano_h3_audio_2026_10]
      - action: "Try the fl2va training adapter or no adapter if reference audio is garbled."
        why: "The adapters were not trained with reference audio."
        confidence: REP
        sources: [bano_h3_adapters_2026_08]
  - symptom: ignores_prompt
    causes:
      - "overfit: prompt adherence is lost late"
      - "empty or poor captions on a strongly text-conditioned model"
      - "memorised set"
    fixes:
      - action: "Use an earlier checkpoint; check with a prompt unlike all training images."
        why: "Prompt following goes first as a run overfits."
