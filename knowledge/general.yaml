      - action: "Use an earlier checkpoint and test with a prompt unlike any training image (red hair, other clothes)."
        why: "Memorised looks arrive with steps."
        confidence: CONF
        sources: [atk_overfit_tells_2026_01]
      - set: {learning_rate: {op: mul, value: 0.7}}
        why: "Gentler training memorises less."
        confidence: MEAS
        sources: [meas_region_2026_11]
  - symptom: trigger_as_text
    causes:
      - "the trigger is gibberish with digits or symbols"
    fixes:
