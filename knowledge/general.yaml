        sources: [atk_strength_2026_07]
  - symptom: too_strong
    causes:
      - "overtraining"
      - "a guidance-loss or distilled-guidance LoRA (over-applied at strength 1.0)"
    fixes:
      - action: "Lower the LoRA strength to 0.6-0.85 and use an earlier checkpoint."
