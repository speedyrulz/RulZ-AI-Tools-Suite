        sources: [atk_overfit_tells_2026_01]
      - action: "Make the captions describe what changes (clothes, place, pose) and avoid blank caption files."
        why: "Bad captions are worse than none, and blank ones are harmful on text-conditioned models."
        confidence: REP
        sources: [atk_captions_2026_06, bano_h3_captions_2026_08]
      - set: {learning_rate: {op: mul, value: 0.5}}
        why: "320 images at 6,000 steps lost adherence at 3,000-5,000."
        confidence: REP
        sources: [atk_h3_failures_2026_09]

dataset_rules:
  - id: few_images
    text: "Under about 10 images the LoRA tends to be stiff, copy backgrounds and keep one expression. Aim for 20-35 varied images; with fewer, stay at low rank, stop early and expect to see the same pose."
  - id: many_images
    text: "Over about 100 images rarely helps (170 images were no better than 30). Cull to the best 30-60 unless you have varied clothes, places and light for a big set; a big set needs fewer epochs, not more steps."
  - id: small_images
    text: "Images with a shortest side under 512 px are upscaled in training: only the sharp ones help. Replace or drop them; below 1024 px faces get few details."
  - id: duplicates
    text: "Near-duplicate pairs give one scene extra weight, inflate the copy score and leak between training and held-out photos. Keep the better of each pair."
  - id: no_captions
    text: "Fewer than 80% of the images have a caption file. Write captions that describe clothes, pose, place and light and name the person with the trigger; blank captions are worse than short ones."
  - id: trigger_missing
    text: "The trigger word is not in at least 60% of the first caption words or captions. Put the same trigger in EVERY caption (one missing from some captions was the usual reason for no likeness)."
  - id: trigger_bad_chars
    text: "A trigger with digits or symbols prints as text in the images. Use a real-word-style name."
  - id: low_median_mp
    text: "The median image is under about 0.4 MP: training above that only upscales. Use half a megapixel, or find larger copies of the photos."
  - id: few_closeups
    text: "Few photos with the face large in the frame. Include close-ups (head and shoulders to full face) so the face has detail; crop_augment adds face crops if you have none."
  - id: one_framing
    text: "All photos have the same framing. Mix close-ups, half-body and full-body shots, left and right, from above and below."
  - id: no_distant_shots
    text: "No photos where the face is small in the frame. The face will be wrong at distance; add some half-body and full-body shots and train at several resolutions."
  - id: same_outfit_background
    text: "One outfit, hairstyle or room fills a big share of the photos. It will be baked in even when captioned; vary clothes, places and light, or crop the repeats down."
  - id: text_or_watermarks
    text: "Photos with text, logos or watermarks. Caption them or remove them, or the trigger drags them in."
  - id: smoothed_photos
    text: "Denoised, upscaled or AI-smoothed photos teach plastic skin. Prefer natural grain; run a tone pass on oversaturated or clipped photos."
  - id: other_people
    text: "Other people in the photos: caption them (the character is second from the right) or crop them out."

