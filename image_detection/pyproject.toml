[project]
name = "image-detection"
version = "1.1.1"
description = "Local Qwen3-VL service that matches images against tag rubrics"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pillow>=10.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
heif = ["pillow-heif>=0.16"]
test = ["pytest>=8"]

[project.scripts]
image-detection = "image_detection.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["image_detection"]
# This file lives inside the package folder, so map the package to it.
package-dir = {"image_detection" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
