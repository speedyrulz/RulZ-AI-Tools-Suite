[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rulz-ai-trainer-optimizer"
version = "0.3.5"
description = "RulZ AI Trainer Optimizer: starting settings, run analysis and an AI advisor for character LoRAs in RulZ AI Trainer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nicegui>=4.0,<5",
    "pyyaml>=6",
    "pillow>=10",
]

[project.scripts]
rulz-ai-trainer-optimizer = "rulz_optimizer.main:main"

[tool.setuptools.packages.find]
include = ["rulz_optimizer*"]

[tool.setuptools.package-data]
rulz_optimizer = ["static/*"]
