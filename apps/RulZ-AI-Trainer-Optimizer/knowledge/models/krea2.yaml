        confidence: DISP
        sources: [atk_dop_reg_2026_08, meas_krea_race_2026_11]
  - symptom: everyone_same_face
    causes:
      - "identity absorbed the class word"
    fixes:
      - action: "Caption the rest of the image, give the person a longer unique name in prompts, and lower the LoRA strength or use an earlier checkpoint; fixing a face afterwards by inpainting with the same LoRA works on Krea 2."
        why: "Reported by several users; no setting fixes it."
        confidence: REP
        sources: [atk_multichar_2026_08, atk_dop_reg_2026_08]
  - symptom: wrong_at_angles
    causes:
      - "only frontal photos"
      - "all captions short"
    fixes:
      - action: "Include high-resolution close-ups at odd angles next to clear shots, and keep the other captions long and varied."
