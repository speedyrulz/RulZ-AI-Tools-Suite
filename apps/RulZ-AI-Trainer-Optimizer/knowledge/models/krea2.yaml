        sources: [meas_krea_race_2026_11]
  - symptom: identity_bleed
    causes:
      - "one LoRA with similar-looking people in the images"
      - "a single-identity LoRA touches the weights every person shares"
    fixes:
      - action: "Prompt the second person's traits explicitly, train separate LoRAs, or train all characters in ONE LoRA with distinct long names and about 20% group images captioned with positions; two similar people in one photo LoKr still bled."
