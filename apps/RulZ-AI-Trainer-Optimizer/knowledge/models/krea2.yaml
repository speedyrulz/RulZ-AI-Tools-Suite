        sources: [bano_krea_captions_2026_10, atk_dataset_mix_2026_06]
  - symptom: needs_high_strength
    causes:
      - "trained on Raw but sampled on Turbo"
      - "too few steps"
    fixes:
      - action: "Raise the strength toward 1.0-1.5 before adding steps; lowering it loses likeness, so reduce steps rather than strength if it burns."
