        confidence: REP
        sources: [atk_strength_2026_07, web_earngenix_2026_08]
  - symptom: washed_colors
    causes:
      - "Krea 2 itself clips highlights"
      - "a flat or oversaturated source tone"
    fixes:
      - action: "Do a tone pass on the dataset (remove excess saturation and clipped highlights, keep a few blown highlights and crushed blacks so the look is not flat)."
