      - set: {network_type: {value: lora}, isolation: {value: false}}
        why: "OFT pulled training clothing into headshots and Isolation produced one memorised scene; a plain LoRA stays under the copy limit."
        confidence: MEAS
        sources: [meas_krea_race_2026_11]
  - symptom: same_pose_outfit
    causes:
      - "the same outfit or background in a big share of the set"
      - "OFT"
    fixes:
      - action: "Vary outfits and backgrounds, caption what must stay controllable, and use an earlier checkpoint."
        why: "Uncaptioned repeats bind to the trigger."
        confidence: CONF
        sources: [atk_captions_2026_06, atk_overfit_tells_2026_01]
      - set: {network_type: {value: lora}}
        why: "OFT's strongest traits came with training clothing in headshots."
