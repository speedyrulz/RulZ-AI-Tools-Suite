        confidence: MEAS
        sources: [meas_region_2026_11]
  - symptom: memorized
    causes:
      - "OFT or Isolation at a high copy score"
      - "too few images, or the same outfit in many"
    fixes:
      - action: "Use an earlier checkpoint and test with a prompt unlike every training photo; 5 images gives a stiff LoRA that repeats the background."
        why: "Common overfit tell."
        confidence: CONF
