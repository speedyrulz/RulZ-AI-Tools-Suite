  - symptom: lost_framing
    causes:
      - "the run was pushed past the point where body renders are still full-body (all 8 body probes lost it by step 1,600 in a 2,000-step run on another model)"
    fixes:
      - action: "Pick the checkpoint before body probes started losing their body (the run log counts them); the best-checkpoint tracker in RulZ AI Trainer already discounts a body score by the framing share."
        why: "Measured on a Qwen-Image 2.1 fine-tune: the drift began about 1,000 steps before the body score went n/a."
        confidence: MEAS
        sources: [meas_region_2026_11]
