open_questions:
  - "OFT (+12 on two seeds) has never been run together with long, clothes-varied captions or the other measured settings; whether its clothing pull is a caption problem is unknown."
  - "Automagic v3 at 1e-4 (the community's choice) has not been raced against AdamW 8-bit in RulZ AI Trainer; the reference here is AdamW."
  - "Whether to use differential guidance on a LoKr (one user liked the combination) is not a RulZ AI Trainer setting, and no A/B separates it from the optimizer and network."
  - "Burn onset (about 4,000 steps for one user, 8,000 fine for another) and the best checkpoint fraction are not settled; the first run on a new set should save often."
  - "Our races used a small fictional set and 0.25 MP; whether the OFT and Keel gains hold on real photos at 1 MP is untested. region_weights (the trainer's character default) is not in the measured runs."
  - "Training on Turbo with a training adapter (reported as good for body consistency) is not possible in RulZ AI Trainer; no controlled comparison with Raw exists."
