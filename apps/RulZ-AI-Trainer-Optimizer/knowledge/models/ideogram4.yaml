# Ideogram 4: character LoRA starting recipe (thin evidence: the training talk is from June 2026).
# Public file: no handles, no personal details, no dataset names. Shared sources are in general.yaml.
id: ideogram4
name: Ideogram 4
kind: image
updated: 2026-11-20
summary: >-
  Community character runs commonly use full-rank LoKr factor 4, automagic3 at 1e-5, weighted timesteps and
  mixed 512/768/1024 buckets. Start near 200 steps per image and compare several checkpoints: likeness can appear
  around 1,500-3,000 steps, while fine marks may need 5,500-7,000. Single-character caption format is disputed;
  correct JSON boxes help multi-character training. Judge exported checkpoints in ComfyUI without Turbo, with the
  LoRA on both conditional and unconditional models. These are community reports, not a controlled trainer test.
model_preset: Ideogram-4
model_path: ideogram-ai/ideogram-4-fp8
facts:
  - text: "Caption format is disputed for a single character: several trainers reported plain captions equal or better than JSON, although one earlier 8,000-step plain-caption run remained weak. Correct JSON boxes help multi-character training; malformed boxes or excessive detail in a character box can hurt. RulZ AI Trainer wraps plain captions in minimal JSON. Match validation prompts to caption style."
    confidence: DISP
    sources: [id_json_2026_06, id_slow_2026_06, id_ideo_focused_2026_06, id_at_focused_2026_06]
  - text: "For multi-character JSON, use one correctly ordered [y_min, x_min, y_max, x_max] box per person, normalised to 0-1000 regardless of image or training resolution. Put the full caption and trigger in the high-level description and the trigger in the character box. Check captioner coordinate order."
    confidence: CONF
    sources: [id_ideo_focused_2026_06, id_at_focused_2026_06]
  - text: "Use a class word such as woman or man as the trigger; nonsense tokens can be rendered as text. Do not caption permanent identity traits. Caption watermarks and varying details."
    confidence: REP
    sources: [id_ideo_focused_2026_06, id_at_focused_2026_06, id_trigger_json_2026_06]
  - text: "Full-rank LoKr factor 4 was compared with factor 8 and rank-64 LoRA; the smaller adapters learned tattoos and moles more slowly. Factor 8 and LoRA can work for simpler subjects. Optimizer and network preferences are disputed, and these were not controlled comparisons."
    confidence: DISP
    sources: [id_at_focused_2026_06, id_ideo_focused_2026_06]
  - text: "First likeness often appears at 1,500-3,000 steps; tattoos and fine marks may need 5,500-7,000. Reports range from 30-50 to about 200 steps per image, and one 48-image run peaked at 3,000. Overtraining can produce artifacts, baked colour, bad anatomy or unlearning rather than collapse; neighbouring checkpoints can differ, so test several."
    confidence: DISP
    sources: [id_ideo_focused_2026_06, id_at_focused_2026_06, id_steps_2026_06]
  - text: "Weighted timesteps and mixed 512/768/1024 buckets recur in character runs; linear and other timesteps also have advocates. One mixed-bucket run was grainy or soft, while other mixed runs worked."
    confidence: DISP
    sources: [id_at_focused_2026_06, id_buckets_2026_06]
  - text: "DOP results conflict: some report excellent identity, others slower learning or class leakage. Its trigger must match captions exactly, including case, and text-embedding caching must be off."
    confidence: DISP
    sources: [id_at_focused_2026_06, id_dop_2026_06]
  - text: "AI Toolkit training samples can be grotesque while the exported adapter works in ComfyUI. Evaluate without Turbo at about 20-30 steps, applying the adapter to the conditional model at 1.0 and the unconditional model at 0.2-0.5; the value of unconditional strength is disputed. Turbo at CFG 1 damages character results. Lower guidance on the last steps if outputs burn."
    confidence: DISP
    sources: [id_at_focused_2026_06, id_ideo_focused_2026_06, id_cfg_2026_06]
  - text: "Mixing square face crops and tall body shots produced elongated necks in one report; use two or three consistent aspect ratios. Upscaled photos can teach upscaler grain."
    confidence: REP
    sources: [id_ideo_focused_2026_06, id_at_focused_2026_06]
  - text: "After June offload fixes, 1024 training fits on a 24 GB card in some configurations, though full-rank LoKr 4 at 1024-only just missed 24 GB in one run. Mixed resolutions worked on 16 GB; memory depends on offload and quantisation. RulZ AI Trainer's text encoder is large and can be quantised."
    confidence: REP
    sources: [id_at_focused_2026_06, id_ideo_focused_2026_06, doc_trainer_3_28]
  - text: "The unconditional model is a perturbed, worse copy; training the concept into it may cancel the guidance gap. The empty caption stays empty in RulZ AI Trainer, so caption dropout trains that branch."
    confidence: REP
    sources: [id_uncond_2026_06, doc_trainer_3_28]
base:
  network_type:
    value: lokr
    why: "Full-rank LoKr factor 4 recurs in character reports and learned fine marks faster than factor 8 or rank-64 LoRA in comparisons; other networks can work."
    confidence: DISP
    sources: [id_at_focused_2026_06, id_ideo_focused_2026_06]
  lokr_factor:
    value: 4
    why: "Factor 4 is the repeated full-rank character recipe; the trainer uses a full matrix for the second factor."
    confidence: REP
    sources: [id_at_focused_2026_06]
  optimizer:
    value: automagic3
    why: "The repeated character recipe uses automagic3; AdamW8bit and Adafactor also worked for some trainers."
    confidence: DISP
    sources: [id_at_focused_2026_06, id_ideo_focused_2026_06]
  learning_rate:
    value: 1.0e-5
    why: "Start automagic3 at 1e-5 as in the repeated character recipe; higher rates had mixed results."
    confidence: DISP
    sources: [id_at_focused_2026_06, id_ideo_focused_2026_06]
  lr_scheduler:
    value: constant
    why: "Constant is the trainer's default and the web recipes' schedule."
    confidence: DOC
    sources: [doc_trainer_3_28]
  timestep_sampling:
    value: logit_normal
    why: "Middle-weighted logit-normal is the trainer's closest available choice to AI Toolkit weighted; linear and other distributions also have advocates."
    confidence: DISP
    sources: [id_at_focused_2026_06, id_ideo_focused_2026_06]
  resolution_shift:
    value: true
    why: "Shift the noise levels by picture size, as Ideogram's sampler does and as RulZ AI Trainer's wizard sets with logit-normal; not compared in these character reports."
    confidence: GUESS
    sources: [id_at_focused_2026_06, doc_trainer_3_28]
  batch_size:
    value: 1
    why: "Batch 1 in every recipe; batches above 1 raised memory and trained oddly for some trainers."
    confidence: REP
    sources: [web_estylon_2026_06, id_firstcfg_2026_06]
  caption_dropout:
    value: 0.05
    why: "0.05 in the first community config and a web recipe. Dropped captions train the unconditional branch, which is a perturbed copy (open question)."
    confidence: REP
    sources: [id_firstcfg_2026_06, web_estylon_2026_06]
  resolutions:
    value: [0.25, 0.5, 1.0]
    why: "The repeated character recipe mixes 512, 768 and 1024 buckets; one other mixed run was grainy or soft."
    confidence: DISP
    sources: [id_at_focused_2026_06, id_buckets_2026_06]
  save_every:
    value: 250
    why: "Checkpoints are not monotonic (some middle ones fail while neighbours are fine; overtraining shows as artifacts, not collapse), so save often and compare several."
    confidence: REP
    sources: [id_at_focused_2026_06, id_ideo_focused_2026_06]
  keep_checkpoints:
    value: 12
    why: "A factor-4 LoKr checkpoint is about 1 GB: keep the newest 12 to compare."
    confidence: GUESS
    sources: [id_at_focused_2026_06]
  isolation:
    value: false
    why: "DOP has disputed benefits and can slow identity; if enabled, match the trigger exactly and disable text-embedding caching."
    confidence: DISP
    sources: [id_dop_2026_06, id_at_focused_2026_06]
  turbo_lora:
    value: ""
    why: "Judge on the full model: Turbo at CFG 1 damaged character LoRA results."
    confidence: REP
    sources: [id_cfg_2026_06, id_ideo_focused_2026_06]
  sample_steps:
    value: 20
    why: "Ideogram's own 20-step preset (48 steps is its quality preset)."
    confidence: DOC
    sources: [doc_trainer_3_28]
  sample_cfg:
    value: 7.0
    why: "Ideogram's guidance 7; the last steps drop to 3 by themselves, as the CFG override does. Lower it if outputs look overcooked."
    confidence: DOC
    sources: [doc_trainer_3_28, id_cfg_2026_06]
  probe_steps:
    value: 20
    why: "Probes sample as the previews do so the face score sees the look you judge."
    confidence: DOC
    sources: [doc_trainer_3_28]
  probe_cfg:
    value: 7.0
    why: "As the samples."
    confidence: DOC
    sources: [doc_trainer_3_28]
  probe_seeds:
    value: 4
    why: "A single probe swings about 10 points between seeds; four seeds give a curve you can read."
    confidence: MEAS
    sources: [meas_region_2026_11, meas_krea_race_2026_11]
  likeness_framing:
    value: true
    why: "Counts a body render with no body as zero so best-checkpoint tracking is not fooled by lost framing."
    confidence: MEAS
    sources: [meas_region_2026_11]
  copy_check:
    value: "on"
    why: "Logs the copy score with the probes so a memorised checkpoint shows."
    confidence: MEAS
    sources: [meas_krea_race_2026_11]
steps:
  epochs: 200
  min: 3000
  max: 8000
  round_to: 50
  why: "Start near 200 steps per image, clamped to 3,000-8,000; reports vary widely and fine marks may arrive later than likeness. Compare multiple checkpoints, including earlier ones."
  confidence: DISP
  sources: [id_at_focused_2026_06, id_ideo_focused_2026_06, id_steps_2026_06]
adjust:
  - id: small_dataset
    when: {images_min: 15, images_max: 40}
    set:
      holdout_images: {value: 3, why: "Three held-out photos let the sweeps show where the subject stops being learned (measured on a Qwen-Image 2.1 fine-tune; never run on Ideogram).", confidence: MEAS, sources: [meas_region_2026_11]}
      region_sweep_every: {value: 4, why: "A sweep every 4 epochs costs little on a small set.", confidence: MEAS, sources: [meas_region_2026_11]}
    note: "Character reports include 20-30 images and several thousand steps; compare checkpoints."
  - id: large_dataset
    when: {images_min: 80}
    set:
      holdout_images: {value: 8, why: "Up to a fifth of the set may be held out; eight photos give a steadier held-out curve.", confidence: MEAS, sources: [meas_region_2026_11]}
      region_sweep_every: {value: 4, why: "As for the small set.", confidence: MEAS, sources: [meas_region_2026_11]}
    note: "The 8,000-step cap gives fewer than 100 steps per image above 80 images; inspect checkpoints and extend only if needed."
  - id: goal_quick
    when: {goal: quick}
    set:
      probe_seeds: {value: 2, why: "A first test needs a rough read only.", confidence: GUESS, sources: []}
    note: "A quick test may show little at 1,000 steps; first likeness often appears around 1,500-3,000."
  - id: goal_likeness
    when: {goal: likeness}
    set:
      probe_seeds: {value: 6, why: "More probe seeds make the best checkpoint reliable.", confidence: MEAS, sources: [meas_krea_race_2026_11]}
  - id: focus_face
    when: {focus: face}
    set:
      crop_augment: {value: face, why: "Close-ups teach the face's detail; bust crops would mostly teach the build.", confidence: DOC, sources: [doc_trainer_3_28]}
      face_weight: {value: 1.0, why: "A face-only run scores the face alone.", confidence: DOC, sources: [doc_trainer_3_28]}
      body_weight: {value: 0.0, why: "A face-only run scores the face alone.", confidence: DOC, sources: [doc_trainer_3_28]}
  - id: focus_face_body
    when: {focus: face_body}
    set:
      crop_augment: {value: face+bust, why: "Close-ups for the face and head-and-shoulders crops between them and the whole photos.", confidence: DOC, sources: [doc_trainer_3_28]}
    note: "One web run used 20 full-body and 20 face close-ups; JSON captions with a bbox isolating the person helped for one user."
  - id: low_median_mp
    when: {median_mp_max: 0.4}
    set:
      resolutions: {value: [0.25], why: "The photos are under 0.4 MP: training above their size only upscales them; 512-only is risky on this model, so upscale the photos first if you can.", confidence: DOC, sources: [doc_trainer_3_28, id_buckets_2026_06]}
  - id: no_captions
    when: {has_captions: false}
    set:
      caption_dropout: {value: 0.0, why: "Most images have no caption file, so there is nothing to drop.", confidence: GUESS, sources: []}
    note: "Add captions describing variable details and watermarks, but omit permanent identity traits. Plain captions can work for one character; use correctly ordered, normalised JSON boxes for multiple characters."
  - id: vram_24
    when: {vram_max_gb: 24}
    set:
      transformer_quant: {value: int8_convrot, why: "bf16 needs about 18.6 GB; int8 is 9.6 GB (the trainer picks it from 16 GB).", confidence: DOC, sources: [doc_trainer_3_28]}
      text_encoder_quant: {value: int8, why: "Halves the 17.5 GB Qwen3-VL-8B so it fits the GPU for caching.", confidence: DOC, sources: [doc_trainer_3_28]}
  - id: vram_16
    when: {vram_max_gb: 16}
    set:
      transformer_quant: {value: int8_convrot, why: "int8 (9.6 GB) is the trainer's pick for 16 GB cards.", confidence: DOC, sources: [doc_trainer_3_28]}
      text_encoder_quant: {value: int8, why: "Halves the 17.5 GB text encoder.", confidence: DOC, sources: [doc_trainer_3_28]}
    note: "A mixed-resolution LoKr 4 run worked on 16 GB in AI Toolkit; memory and offload behavior differ between trainers."
evaluate:
  strength: "Conditional 1.0; try unconditional 0.2-0.5 and compare, as its ideal strength is disputed."
  sampler: "Judge exported checkpoints in ComfyUI with the LoRA on both conditional and unconditional models, without Turbo."
  steps: "About 20-30 full-model steps; Turbo at CFG 1 damaged character results."
  cfg: "About 3-5, or 6-7 with a lower guidance override on the last steps."
  notes:
    - "AI Toolkit training samples can be misleading; judge several exported checkpoints in ComfyUI."
    - "Overtraining may show artifacts, bad anatomy, baked colour or unlearning; neighbouring checkpoints can differ."
    - "Match validation prompt style to captions; use normalised, correctly ordered boxes for multi-character JSON."
    - "Test a second person in the frame for identity bleed."
flaws:
  - symptom: no_likeness
    causes:
      - "bad captions or incorrectly ordered JSON boxes; single-character caption format is disputed"
      - "too few images (12-15) for this model's slow convergence"
      - "the LoRA applied on the conditional pass only when testing"
    fixes:
      - action: "Check caption quality and add varied images; for multiple characters use correctly ordered, normalised JSON boxes."
        why: "Several single-character trainers preferred plain captions, while correct JSON boxes helped multi-character training; an earlier plain-caption run was weak."
        confidence: DISP
        sources: [id_at_focused_2026_06, id_ideo_focused_2026_06, id_slow_2026_06]
      - set: {timestep_sampling: {value: shift}, timestep_shift: {value: 5.0}}
        why: "One user later said shift was the only timestep that worked for him; the 5.0 value is Ideogram's sampler shift and a guess for training. Contradicts the weighted-style default."
        confidence: REP
        sources: [id_shift_2026_10, id_cfg_2026_06]
      - action: "Test with the LoRA applied on both the conditional and the unconditional pass before concluding it does nothing."
        why: "A three-way comparison showed the difference."
        confidence: REP
        sources: [id_lora_both_2026_06]
  - symptom: slow_likeness
    causes:
      - "likeness and fine details may need several thousand steps; reports vary"
      - "DOP or an automagic LR that fell toward 1e-8"
    fixes:
      - action: "Keep going to 3,500-7,500 steps on 26-50 images if the probes are still rising; do not call it failed at 1,000."
        why: "Reports of 5,000-6,500 steps for 26 images and a best epoch at step 7,750 for 50."
        confidence: REP
        sources: [id_steps_2026_06]
      - set: {isolation: {value: false}}
        why: "DOP made identity arrive very late for two users."
        confidence: REP
        sources: [id_dop_2026_06]
  - symptom: peaked_early
    causes:
      - "overshoot and unlearning: the look goes sharp then blurry again, even at 5e-5"
    fixes:
      - set: {learning_rate: {op: mul, value: 0.5}}
        why: "Try a lower starting rate and keep earlier checkpoints."
        confidence: REP
        sources: [id_overshoot_2026_06]
      - action: "Pick the checkpoint before the blur returns; save every 100-250 steps."
        why: "Artifacts and unlearning can appear without collapse; compare neighbouring checkpoints."
        confidence: REP
        sources: [id_overshoot_2026_06]
  - symptom: identity_bleed
    causes:
      - "plain captions and no boxes in a multi-character set"
    fixes:
      - action: "Use JSON bbox captions: one box per person, boxes in [y_min, x_min, y_max, x_max] order normalised to 0-1000, a short background line. Train all characters in one LoRA."
        why: "The method of the zero-bleed dual-character and eight-character LoRAs."
        confidence: CONF
        sources: [id_json_2026_06]
      - set: {isolation: {value: true}, optimizer: {value: adamw8bit}, learning_rate: {value: 5.0e-5}}
        why: "DOP results are disputed; match the trigger exactly and turn text-embedding caching off. With isolation RulZ AI Trainer trains Automagic as AdamW, so use AdamW8bit at 5e-5 (the community's 5e-5 to 8e-5) instead of Automagic's 1e-5 start."
        confidence: DISP
        sources: [id_dop_2026_06]
  - symptom: burned
    causes:
      - "the CFG override used backwards or too many high-guidance steps"
      - "overtraining (one test was a bit burned at 1,750 steps)"
    fixes:
      - action: "The override is a LOWER guidance on the last steps (not higher); lower the CFG if outputs look overcooked."
        why: "Two users and the sampler maintainer."
        confidence: CONF
        sources: [id_cfg_2026_06]
      - set: {learning_rate: {op: mul, value: 0.5}}
        why: "A lower rate delays burn; overshoot appeared even at 5e-5."
        confidence: GUESS
        sources: [id_overshoot_2026_06]
  - symptom: noisy_grainy
    causes:
      - "upscaled photos can teach grain; one mixed-bucket run was grainy or soft"
    fixes:
      - set: {resolutions: {value: [1.0]}}
        why: "Train at 1024 only, as the first community config did; the model's native range is near 1024-2k."
        confidence: DISP
        sources: [id_buckets_2026_06]
  - symptom: lr_collapsed
    causes:
      - "automagic v3 with DOP drove the LR to about 1e-8 by step 750"
    fixes:
      - set: {optimizer: {value: adamw8bit}, learning_rate: {value: 5.0e-5}, isolation: {value: false}}
        why: "A fixed-rate optimizer without DOP; automagic's floor in RulZ AI Trainer also prevents it (min lr 2e-5, lowered to a fifth of the start when not below it: 2e-6 with this recipe's 1e-5)."
        confidence: REP
        sources: [id_dop_2026_06, atk_automagic_floor_2026_10]
  - symptom: trigger_as_text
    causes:
      - "a trigger with digits or symbols, or an LLM rewriter that deleted the trigger"
    fixes:
      - action: "Use a class word such as woman or man, and keep it in the caption descriptions."
        why: "Cross-model finding plus the Ideogram note."
        confidence: CONF
        sources: [atk_trigger_text_2026_07, id_trigger_json_2026_06]
  - symptom: same_pose_outfit
    causes:
      - "a small set, overshoot, or backgrounds learned from the photos"
    fixes:
      - action: "Vary outfits and backgrounds in the set, describe the background in the JSON caption, and use an earlier checkpoint."
        why: "Uncaptioned repeats bind to the trigger."
        confidence: REP
        sources: [atk_captions_2026_06, id_overshoot_2026_06]
  - symptom: out_of_memory
    causes:
      - "bf16 (18.6 GB) or the 17.5 GB text encoder on a card under 32 GB"
    fixes:
      - set: {transformer_quant: {value: int8_convrot}, text_encoder_quant: {value: int8}}
        why: "int8 is 9.6 GB for the transformer and halves the text encoder."
        confidence: DOC
        sources: [doc_trainer_3_28]
      - set: {transformer_quant: {value: nvfp4}}
        why: "NVFP4 is 5.5 GB; do not shrink by training at 512 only."
        confidence: DOC
        sources: [doc_trainer_3_28, id_buckets_2026_06]
open_questions:
  - "Which caption format and timestep distribution work best for a particular single-character set? Reports conflict."
  - "How much does unconditional LoRA strength help, and does caption dropout affect the perturbed unconditional branch?"
  - "How do these community settings transfer to RulZ AI Trainer? They have not been measured on a real Ideogram model here."
