[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rulztrainer"
version = "0.1.0"
description = "Diffusion LoRA trainer with a WebUI: MOSS-Image, FLUX 3 Klein, FLUX.2 Klein 9B, Qwen-Image 2.1, Krea 2, FIBO 2.0, Ideogram 4 and MiniMax H3."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.9", "diffusers>=0.41", "transformers>=5.3", "accelerate>=1.10", "openpyxl>=3.1",
  "safetensors>=0.6", "huggingface_hub>=0.30", "Pillow>=10", "pyyaml>=6", "nicegui>=3", "psutil>=5.9",
]

[tool.setuptools.packages.find]
include = ["rulztrainer*"]
