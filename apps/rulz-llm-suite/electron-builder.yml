appId: com.rulz.llmsuite
productName: RulZ LLM Suite
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: resources/calc_mcp.py
    to: calc_mcp.py
  # pdf.js character maps: read from disk when a PDF needs them (Chinese, Japanese and Korean text).
  - from: node_modules/pdfjs-dist/cmaps
    to: pdfjs-cmaps
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: RulZ-LLM-Suite-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: RulZ LLM Suite
  uninstallDisplayName: RulZ LLM Suite
npmRebuild: false
