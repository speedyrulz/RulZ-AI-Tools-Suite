name: Release

# Builds the Windows installer and attaches it to a GitHub Release whenever a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Build installer
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The launcher's self-update checks the downloaded setup against this (sha256sum format). GitHub renames
      # spaces in asset names to dots, so the names are written that way.
      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.exe.blockmap' } |
            ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name -replace ' ', '.')" } |
            Set-Content -Encoding ascii dist/SHA256SUMS
          Get-Content dist/SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/SHA256SUMS
          generate_release_notes: true
